<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramo amarillo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<p>Haz clic en el ramo para volver a armarlo</p>

<svg id="bouquet" class="play" viewBox="0 0 600 800" role="button" tabindex="0"
     aria-label="Ramo de seis flores amarillas: girasol, rosa, narciso, diente de león, loto y tulipán. Actívalo para animarlo de nuevo">
  <defs>
    <!-- girasol -->
    <linearGradient id="gSunBack"  x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e89a00"/><stop offset="1" stop-color="#ffc42b"/></linearGradient>
    <linearGradient id="gSunFront" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ffe45c"/></linearGradient>
    <!-- rosa -->
    <radialGradient id="gRose" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="78">
      <stop offset="0" stop-color="#d08a00"/><stop offset=".55" stop-color="#f7b900"/><stop offset="1" stop-color="#ffe066"/>
    </radialGradient>
    <!-- narciso -->
    <radialGradient id="gNarFront" cx=".5" cy=".9" r=".9">
      <stop offset="0" stop-color="#f5b800"/><stop offset=".45" stop-color="#ffd83a"/><stop offset="1" stop-color="#ffea7a"/>
    </radialGradient>
    <radialGradient id="gNarBack" cx=".5" cy=".9" r=".9">
      <stop offset="0" stop-color="#e59a00"/><stop offset=".5" stop-color="#f6bb14"/><stop offset="1" stop-color="#ffd94a"/>
    </radialGradient>
    <radialGradient id="gNarCup">
      <stop offset="0" stop-color="#cf8500"/><stop offset=".32" stop-color="#f2a800"/><stop offset=".65" stop-color="#ffc21a"/><stop offset="1" stop-color="#ffd54a"/>
    </radialGradient>
    <!-- tulipán -->
    <linearGradient id="gTB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e29800"/><stop offset="1" stop-color="#f7c400"/></linearGradient>
    <linearGradient id="gTS" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f2ad00"/><stop offset="1" stop-color="#ffd935"/></linearGradient>
    <linearGradient id="gTF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#fff08a"/></linearGradient>
    <!-- loto -->
    <linearGradient id="gLB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e29400"/><stop offset="1" stop-color="#ffe066"/></linearGradient>
    <linearGradient id="gLM" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f0a800"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
    <linearGradient id="gLF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffbf14"/><stop offset="1" stop-color="#fffbd0"/></linearGradient>
    <!-- envoltorio -->
    <linearGradient id="gPaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f0df"/><stop offset="1" stop-color="#e6d6b8"/></linearGradient>
  </defs>

  <!-- capas de atrás hacia adelante -->
  <g class="paper">
    <path d="M150 505 Q300 540 450 505 L332 700 L268 700Z" fill="#cbb99a"/>
    <g id="leaves"></g>
  </g>
  <g id="stems"></g>
  <g id="heads"></g>

  <!-- papel de envolver -->
  <g class="paper">
    <path d="M158 530 Q300 578 442 530 L326 784 Q300 794 274 784Z" fill="url(#gPaper)"/>
    <path d="M300 566 L442 530 L326 784 Q300 794 300 790Z" fill="rgba(120,90,50,.09)"/>
    <path d="M300 566 L300 788 M225 548 L288 784 M375 548 L312 784" stroke="rgba(120,90,50,.28)" stroke-width="1.5" fill="none"/>
    <!-- listón -->
    <path d="M294 620 L262 694 L284 686 L296 706Z" fill="#d24d63"/>
    <path d="M306 620 L338 694 L316 686 L304 706Z" fill="#d24d63"/>
    <path d="M212 590 Q300 612 388 590 L384 614 Q300 636 216 614Z" fill="#e0566b"/>
    <path d="M300 612 C255 570 225 615 258 640 C275 652 296 632 300 612Z" fill="#ee6f82" stroke="#b83c50" stroke-width="1.5"/>
    <path d="M300 612 C345 570 375 615 342 640 C325 652 304 632 300 612Z" fill="#ee6f82" stroke="#b83c50" stroke-width="1.5"/>
    <circle cx="300" cy="616" r="9" fill="#c9445a"/>
  </g>
</svg>

<script src="script.js"></script>
</body>
</html>
