<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narciso</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 35%, #2f5a45, #1a3327);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    color: #f3e7a3;
  }
  p { position: fixed; bottom: 16px; margin: 0; width: 100%; text-align: center; font-size: 14px; opacity: .75; }

  .plant {
    position: relative;
    width: 300px;
    height: 520px;
    transform-origin: 50% 100%;
    animation: sway 6s ease-in-out infinite;
  }

  .stem {
    position: absolute;
    left: calc(50% - 5px);
    top: 40px;
    bottom: 0;
    width: 10px;
    border-radius: 5px;
    background: linear-gradient(#5aa03a, #35722a);
  }
  .leaf {
    position: absolute;
    bottom: 0;
    width: 28px;
    height: 300px;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: linear-gradient(#7cc04c, #2f6b25);
    transform-origin: 50% 100%;
  }
  .l1 { left: calc(50% - 46px); transform: rotate(-13deg); }
  .l2 { left: calc(50% + 18px); height: 250px; transform: rotate(11deg); }

  /* la cabeza está en el punto (0,0) y los pétalos salen desde ahí */
  .head { position: absolute; left: 50%; top: 40px; width: 0; height: 0; }

  .petal {
    position: absolute;
    left: -55px;
    bottom: 0;
    width: 110px;
    height: 150px;
    border-radius: 50% 50% 50% 50% / 75% 75% 25% 25%;
    background: radial-gradient(ellipse at 50% 90%, #f5b800 0, #ffd83a 45%, #ffea7a 100%);
    box-shadow: inset 0 0 12px rgba(190, 120, 0, .35);
    transform-origin: 50% 100%;
    transform: rotate(var(--a));
    animation: open 1.6s cubic-bezier(.2, .8, .2, 1) both;
    animation-delay: var(--d);
  }
  .petal.back {
    left: -47px;
    width: 94px;
    height: 128px;
    background: radial-gradient(ellipse at 50% 90%, #e59a00 0, #f6bb14 50%, #ffd94a 100%);
  }

  .cup {
    position: absolute;
    left: -46px;
    top: -46px;
    width: 92px;
    height: 92px;
    box-sizing: border-box;
    border-radius: 50%;
    border: 9px dotted #ffbe0b;
    background: radial-gradient(circle, #cf8500 0, #f2a800 32%, #ffc21a 65%, #ffd54a 100%);
    box-shadow: inset 0 0 18px rgba(150, 80, 0, .55), 0 4px 10px rgba(0, 0, 0, .25);
    animation: pop .9s 1s cubic-bezier(.3, 1.4, .5, 1) both;
  }

  @keyframes open {
    from { transform: rotate(var(--a)) scale(.05); opacity: 0; }
    to   { transform: rotate(var(--a)) scale(1);   opacity: 1; }
  }
  @keyframes pop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .plant, .petal, .cup { animation: none; }
  }
</style>
</head>
<body>
  <div class="plant" role="img" aria-label="Narciso amarillo">
    <div class="stem"></div>
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>

    <div class="head">
      <!-- anillo trasero -->
      <i class="petal back" style="--a:30deg;  --d:.05s"></i>
      <i class="petal back" style="--a:90deg;  --d:.10s"></i>
      <i class="petal back" style="--a:150deg; --d:.15s"></i>
      <i class="petal back" style="--a:210deg; --d:.20s"></i>
      <i class="petal back" style="--a:270deg; --d:.25s"></i>
      <i class="petal back" style="--a:330deg; --d:.30s"></i>
      <!-- anillo delantero -->
      <i class="petal" style="--a:0deg;   --d:.35s"></i>
      <i class="petal" style="--a:60deg;  --d:.40s"></i>
      <i class="petal" style="--a:120deg; --d:.45s"></i>
      <i class="petal" style="--a:180deg; --d:.50s"></i>
      <i class="petal" style="--a:240deg; --d:.55s"></i>
      <i class="petal" style="--a:300deg; --d:.60s"></i>
      <!-- corona central -->
      <div class="cup"></div>
    </div>
  </div>
  <p>Narciso: seis pétalos y una corona, solo con CSS</p>
</body>
</html>
