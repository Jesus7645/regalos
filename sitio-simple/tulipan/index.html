<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulipán</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(#efe6fb, #cdbdea);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    color: #4a3a6b;
  }
  svg {
    height: min(88vh, 640px);
    width: auto;
    cursor: pointer;
    outline-offset: 8px;
  }
  p { position: fixed; bottom: 16px; margin: 0; width: 100%; text-align: center; font-size: 14px; opacity: .8; }

  .plant { transform-origin: 200px 600px; animation: sway 7s ease-in-out infinite; }

  /* pétalos: giran desde la base de la flor */
  .petal { transform-origin: 200px 304px; transition: transform 1.3s cubic-bezier(.3, 1.2, .5, 1); }
  .left  { transform: rotate(12deg); }
  .right { transform: rotate(-12deg); }
  .back  { transform: scale(.94); }
  .front { transform: scale(1); }

  svg.open .left  { transform: rotate(-9deg); }
  svg.open .right { transform: rotate(9deg); }
  svg.open .back  { transform: scale(1.04); }
  svg.open .front { transform: scale(.9) translateY(6px); }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.2deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .plant { animation: none; }
    .petal { transition: none; }
  }
</style>
</head>
<body>
<svg id="tulip" viewBox="0 0 400 620" role="button" tabindex="0" aria-label="Tulipán amarillo. Actívalo para abrirlo o cerrarlo">
  <defs>
    <linearGradient id="gBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e29800"/><stop offset="1" stop-color="#f7c400"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2ad00"/><stop offset="1" stop-color="#ffd935"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#fff08a"/>
    </linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2e6b3a"/><stop offset="1" stop-color="#7fbf4d"/>
    </linearGradient>
  </defs>

  <g class="plant">
    <!-- tallo y hojas -->
    <path d="M200 300 C196 390 210 480 200 592" stroke="#3e8a3f" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M203 500 C120 470 80 380 92 330 C150 360 195 430 203 500Z" fill="url(#gLeaf)"/>
    <path d="M201 545 C280 520 320 450 312 400 C255 420 208 480 201 545Z" fill="url(#gLeaf)"/>

    <!-- flor -->
    <g>
      <path class="petal back"  d="M200 300 C142 285 140 150 200 92 C260 150 258 285 200 300Z" fill="url(#gBack)"/>
      <path class="petal left"  d="M200 304 C128 300 96 214 112 116 C158 152 198 212 200 304Z" fill="url(#gSide)"/>
      <path class="petal right" d="M200 304 C272 300 304 214 288 116 C242 152 202 212 200 304Z" fill="url(#gSide)"/>
      <g class="petal front">
        <path d="M200 308 C150 296 146 200 200 132 C254 200 250 296 200 308Z" fill="url(#gFront)"/>
        <path d="M200 146 C200 200 200 250 200 300" stroke="rgba(190,120,0,.35)" stroke-width="2" fill="none"/>
      </g>
    </g>
  </g>
</svg>
<p>Haz clic en el tulipán para abrirlo o cerrarlo</p>

<script>
const tulip = document.getElementById('tulip');
const toggle = () => tulip.classList.toggle('open');
tulip.addEventListener('click', toggle);
tulip.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
});
// se abre solo al cargar
setTimeout(() => tulip.classList.add('open'), 600);
</script>
</body>
</html>
