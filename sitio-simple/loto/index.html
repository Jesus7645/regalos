<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loto amarillo</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(#0e3a42, #1c6a69);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    color: #e9f3c9;
  }
  svg { height: min(88vh, 640px); width: auto; cursor: pointer; outline-offset: 8px; }
  p { position: fixed; bottom: 16px; margin: 0; width: 100%; text-align: center; font-size: 14px; opacity: .8; }

  /* los pétalos giran desde la base de la flor */
  .petal {
    transform-origin: 200px 395px;
    transform: rotate(calc(var(--a) * .2));
    transition: transform 2.2s cubic-bezier(.25, 1, .4, 1);
    transition-delay: var(--d);
  }
  svg.open .petal { transform: rotate(var(--a)); }

  .stamens { transform-origin: 200px 355px; transform: scale(.4); opacity: 0; transition: transform 2s .9s, opacity 1.4s .9s; }
  svg.open .stamens { transform: scale(1); opacity: 1; }

  .bob { animation: bob 5s ease-in-out infinite; }
  .ripple {
    transform-origin: 200px 400px;
    animation: ripple 6s ease-out infinite;
    animation-delay: var(--d);
    opacity: 0;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  @keyframes ripple {
    0%   { transform: scale(.35); opacity: .55; }
    100% { transform: scale(1);   opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bob, .ripple { animation: none; }
    .petal, .stamens { transition: none; }
  }
</style>
</head>
<body>
<svg id="lotus" viewBox="0 0 400 520" role="button" tabindex="0" aria-label="Loto amarillo. Actívalo para abrirlo o cerrarlo">
  <defs>
    <linearGradient id="gBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e29400"/><stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f0a800"/><stop offset="1" stop-color="#fff0a0"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffbf14"/><stop offset="1" stop-color="#fffbd0"/>
    </linearGradient>
  </defs>

  <!-- estanque -->
  <ellipse cx="200" cy="420" rx="190" ry="78" fill="rgba(255,255,255,.07)"/>
  <ellipse class="ripple" style="--d:0s" cx="200" cy="400" rx="185" ry="50" fill="none" stroke="#bfe6df" stroke-width="2"/>
  <ellipse class="ripple" style="--d:2s" cx="200" cy="400" rx="185" ry="50" fill="none" stroke="#bfe6df" stroke-width="2"/>
  <ellipse class="ripple" style="--d:4s" cx="200" cy="400" rx="185" ry="50" fill="none" stroke="#bfe6df" stroke-width="2"/>

  <!-- hojas flotantes -->
  <g>
    <path d="M95 420 m-62 0 a62 20 0 1 0 124 0 a62 20 0 1 0 -124 0 M95 420 L142 410" fill="#3b8a4a" stroke="#256a35" stroke-width="1.5"/>
    <path d="M318 440 m-52 0 a52 17 0 1 0 104 0 a52 17 0 1 0 -104 0 M318 440 L360 432" fill="#46995a" stroke="#2c7440" stroke-width="1.5"/>
  </g>

  <g class="bob">
    <g id="rowBack"></g>
    <g id="rowMid"></g>
    <ellipse cx="200" cy="345" rx="20" ry="12" fill="#f5b400"/>
    <g class="stamens" id="stamens"></g>
    <g id="rowFront"></g>
  </g>
</svg>
<p>Haz clic en el loto para abrirlo o cerrarlo</p>

<script>
const NS = 'http://www.w3.org/2000/svg';
const BX = 200, BY = 395; // base de la flor

function petalPath(L, w) {
  return `M${BX} ${BY} C${BX - w} ${BY - L * .3} ${BX - w * .7} ${BY - L * .8} ${BX} ${BY - L} ` +
         `C${BX + w * .7} ${BY - L * .8} ${BX + w} ${BY - L * .3} ${BX} ${BY}Z`;
}

function addRow(id, angles, L, fill, delay) {
  const row = document.getElementById(id);
  angles.forEach((a, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('class', 'petal');
    p.setAttribute('d', petalPath(L, L * .32));
    p.setAttribute('fill', `url(#${fill})`);
    p.setAttribute('stroke', 'rgba(150,90,0,.3)');
    p.setAttribute('stroke-width', '.8');
    p.setAttribute('style', `--a:${a}deg; --d:${(delay + i * 0.06).toFixed(2)}s`);
    row.appendChild(p);
  });
}

// tres filas de pétalos, de atrás hacia adelante
addRow('rowBack',  [-72, -36, 0, 36, 72], 175, 'gBack',  0);
addRow('rowMid',   [-56, -19, 19, 56],    155, 'gMid',   .25);
addRow('rowFront', [-40, 0, 40],          132, 'gFront', .5);

// estambres alrededor del centro
const st = document.getElementById('stamens');
for (let k = 0; k < 15; k++) {
  const ang = (-52 + k * (104 / 14)) * Math.PI / 180;
  const len = 46 + (k % 3) * 7;
  const x1 = BX + Math.sin(ang) * 10, y1 = 350;
  const x2 = BX + Math.sin(ang) * len, y2 = 350 - Math.cos(ang) * len;
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#ffc933');
  line.setAttribute('stroke-width', '2.2');
  line.setAttribute('stroke-linecap', 'round');
  st.appendChild(line);
  const tip = document.createElementNS(NS, 'circle');
  tip.setAttribute('cx', x2); tip.setAttribute('cy', y2); tip.setAttribute('r', 3.2);
  tip.setAttribute('fill', '#e08a00');
  st.appendChild(tip);
}

const lotus = document.getElementById('lotus');
const toggle = () => lotus.classList.toggle('open');
lotus.addEventListener('click', toggle);
lotus.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
});
setTimeout(() => lotus.classList.add('open'), 500); // se abre sola al cargar
</script>
</body>
</html>
